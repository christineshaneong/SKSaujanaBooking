<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>SKSU Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body, html { height: 100%; margin: 0; font-family: sans-serif; }
        .main-container { height: 100vh; }
        .image-side {
            background-image: url('/images/background.jpg');
            background-color: #555; background-size: cover; background-position: center;
        }
        .form-side { display: flex; align-items: center; justify-content: center; background-color: #f8f9fa; }
        .login-card { width: 100%; max-width: 400px; padding: 30px; background: white; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; }
        .school-logo { width: 100px; margin-bottom: 20px; }
        .btn-custom { background-color: #732d91; color: white; border-radius: 25px; width: 100%; padding: 10px; }
        .btn-custom:hover { background-color: #5a2372; color: white; }
    </style>
</head>
<body>
<div class="container-fluid main-container">
    <div class="row h-100">
        <div class="col-md-7 col-lg-8 image-side d-none d-md-block"></div>
        <div class="col-md-5 col-lg-4 form-side">
            <div class="login-card">
                <img src="/images/sksaujana.jpg" alt="Logo" class="school-logo">
                <h3 class="mb-4">Log in</h3>
                <form th:action="@{/login}" method="post">
                    <div class="mb-3 text-start">
                        <label class="form-label text-muted small">Email address</label>
                        <input type="text" name="email" class="form-control" placeholder="teacher@school.edu.my" required>
                    </div>
                    <div class="mb-3 text-start">
                        <label class="form-label text-muted small">Password</label>
                        <input type="password" name="password" class="form-control" placeholder="********" required>
                    </div>
                    <button type="submit" class="btn btn-custom">Log in</button>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
